<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BGG AI Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 select-none">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold text-amber-500 flex items-center gap-2">
        <span>✨</span> BGG AI Scanner
      </h1>
      <button onclick="toggleLoginModal()" class="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg border border-slate-600 transition">
        ⚙️ Ajustes
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- Escáner por IA / Buscador -->
    <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
      <div class="flex border-b border-slate-700 pb-2 gap-4 text-sm font-semibold">
        <button id="tab-cam" onclick="switchTab('cam')" class="text-amber-500 border-b-2 border-amber-500 pb-2">✨ Reconocer Portada IA</button>
        <button id="tab-search" onclick="switchTab('search')" class="text-slate-400 hover:text-slate-200 pb-2">🔍 Búsqueda Manual</button>
      </div>

      <!-- Cámara para IA -->
      <div id="view-cam" class="space-y-3">
        <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-700 shadow-inner">
          <video id="video-preview" playsinline autoplay muted class="w-full h-full object-cover"></video>
          <canvas id="canvas-hidden" class="hidden"></canvas>
          <div id="cam-placeholder" class="absolute text-center text-slate-400 p-4 bg-slate-900/80 rounded-xl">
            Pulsa "Abrir Cámara" y apunta a la portada de la caja.
          </div>
        </div>

        <div class="flex gap-2">
          <button id="btn-toggle-cam" onclick="toggleCamera()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold px-4 rounded-xl transition">
            📷 Abrir Cámara
          </button>
          <button id="btn-snap" onclick="capturarYAnalizarIA()" disabled class="flex-1 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-slate-950 font-bold py-3 rounded-xl transition text-base shadow flex items-center justify-center gap-2">
            <span>✨</span> Analizar Portada con IA
          </button>
        </div>
      </div>

      <!-- Búsqueda Texto -->
      <div id="view-search" class="hidden space-y-3">
        <div class="flex gap-2">
          <input type="text" id="input-query" placeholder="Ej: Catan, Arcs, Carcassonne..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500">
          <button onclick="buscarJuegoManual()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 rounded-xl transition">
            Buscar
          </button>
        </div>
      </div>
    </section>

    <!-- Cargando / Analizando -->
    <div id="loading" class="hidden text-center py-8 space-y-3">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-amber-500 border-t-transparent"></div>
      <p id="loading-text" class="text-sm text-amber-400 font-medium">La IA está reconociendo la imagen...</p>
    </div>

    <!-- Tarjeta de Juego -->
    <section id="game-card" class="hidden bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
      <div class="md:flex">
        <div class="md:w-1/3 bg-slate-950 flex items-center justify-center p-4">
          <img id="game-img" src="" alt="Portada" class="max-h-64 object-contain rounded-lg shadow-md">
        </div>
        <div class="p-6 md:w-2/3 flex flex-col justify-between space-y-4">
          <div>
            <div class="flex justify-between items-start gap-2">
              <h2 id="game-title" class="text-2xl font-bold text-slate-100"></h2>
              <span id="game-year" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-1 rounded font-mono"></span>
            </div>
            <div class="flex gap-4 mt-3 text-sm text-slate-300 font-medium">
              <span id="game-players">👥 -</span>
              <span id="game-time">⏱️ - min</span>
            </div>
            <p id="game-desc" class="text-xs text-slate-400 mt-3 line-clamp-4 leading-relaxed"></p>
          </div>

          <button id="btn-add-bgg" onclick="agregarAColeccion()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
            <span>➕</span> Añadir a mi Colección BGG
          </button>
        </div>
      </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="hidden p-4 rounded-xl text-center text-sm font-semibold border shadow-xl"></div>

  </main>

  <!-- Modal Ajustes -->
  <div id="modal-login" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-amber-500">Configuración</h3>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-amber-400 mb-1">Clave API de Google Gemini (Visión)</label>
          <input type="password" id="gemini-key" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500 text-xs font-mono">
          <p class="text-[10px] text-slate-400 mt-1">Gratis en <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-amber-400 underline">aistudio.google.com</a></p>
        </div>
        <hr class="border-slate-700">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Usuario BGG</label>
          <input type="text" id="bgg-user" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña BGG</label>
          <input type="password" id="bgg-pass" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleLoginModal()" class="px-4 py-2 rounded-xl text-sm bg-slate-700 text-slate-300">Cancelar</button>
        <button onclick="guardarCredenciales()" class="px-4 py-2 rounded-xl text-sm bg-amber-500 text-slate-950 font-bold">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let mediaStream = null;
    let currentGameId = null;

    async function fetchProxy(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 10) return text;
          }
        } catch (e) {}
      }
      throw new Error("Error de conexión");
    }

    function switchTab(tab) {
      if (tab === 'cam') {
        document.getElementById('view-cam').classList.remove('hidden');
        document.getElementById('view-search').classList.add('hidden');
        document.getElementById('tab-cam').className = 'text-amber-500 border-b-2 border-amber-500 pb-2';
        document.getElementById('tab-search').className = 'text-slate-400 hover:text-slate-200 pb-2';
      } else {
        stopCamera();
        document.getElementById('view-cam').classList.add('hidden');
        document.getElementById('view-search').classList.remove('hidden');
        document.getElementById('tab-search').className = 'text-amber-500 border-b-2 border-amber-500 pb-2';
        document.getElementById('tab-cam').className = 'text-slate-400 hover:text-slate-200 pb-2';
      }
    }

    function toggleLoginModal() {
      const modal = document.getElementById('modal-login');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('gemini-key').value = localStorage.getItem('gemini_key') || '';
        document.getElementById('bgg-user').value = localStorage.getItem('bgg_user') || '';
        document.getElementById('bgg-pass').value = localStorage.getItem('bgg_pass') || '';
      }
    }

    function guardarCredenciales() {
      localStorage.setItem('gemini_key', document.getElementById('gemini-key').value.trim());
      localStorage.setItem('bgg_user', document.getElementById('bgg-user').value.trim());
      localStorage.setItem('bgg_pass', document.getElementById('bgg-pass').value.trim());
      toggleLoginModal();
      showToast('Ajustes guardados correctamente', 'success');
    }

    async function toggleCamera() {
      if (mediaStream) {
        stopCamera();
      } else {
        await startCamera();
      }
    }

    async function startCamera() {
      try {
        const constraints = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } };
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('video-preview');
        video.srcObject = mediaStream;
        document.getElementById('cam-placeholder').classList.add('hidden');
        document.getElementById('btn-toggle-cam').innerText = '🛑 Detener';
        document.getElementById('btn-snap').disabled = false;
      } catch (e) {
        showToast('Error al acceder a la cámara', 'error');
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
        document.getElementById('video-preview').srcObject = null;
        document.getElementById('cam-placeholder').classList.remove('hidden');
        document.getElementById('btn-toggle-cam').innerText = '📷 Abrir Cámara';
        document.getElementById('btn-snap').disabled = true;
      }
    }

    async function capturarYAnalizarIA() {
      const geminiKey = localStorage.getItem('gemini_key');
      if (!geminiKey) {
        showToast('Por favor, introduce tu API Key de Gemini en Ajustes (⚙️)', 'error');
        toggleLoginModal();
        return;
      }

      const video = document.getElementById('video-preview');
      const canvas = document.getElementById('canvas-hidden');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      mostrarCargando(true, "✨ La IA está analizando la portada del juego...");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: "Identifica el juego de mesa que aparece en esta imagen. Responde ÚNICAMENTE con el título exacto del juego de mesa en texto plano, sin explicaciones ni comillas ni puntos finales." },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        const tituloDetectado = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (tituloDetectado) {
          showToast(`✨ IA detectó: "${tituloDetectado}"`, 'success');
          mostrarCargando(true, `Buscando "${tituloDetectado}" en BoardGameGeek...`);
          await buscarJuegoBGG(tituloDetectado);
        } else {
          showToast('No se pudo identificar ningún juego en la imagen', 'error');
          mostrarCargando(false);
        }
      } catch (e) {
        showToast('Error al consultar la IA de Gemini. Revisa tu API Key.', 'error');
        mostrarCargando(false);
      }
    }

    async function buscarJuegoManual() {
      const q = document.getElementById('input-query').value.trim();
      if (!q) return;
      mostrarCargando(true, `Buscando "${q}" en BGG...`);
      await buscarJuegoBGG(q);
    }

    async function buscarJuegoBGG(query) {
      try {
        const targetUrl = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
        const xmlText = await fetchProxy(targetUrl);
        
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const items = xml.querySelectorAll("item");

        if (items.length > 0) {
          const bggId = items[0].getAttribute("id");
          await cargarDetallesJuego(bggId);
        } else {
          showToast(`No se encontró "${query}" en BoardGameGeek`, 'error');
          mostrarCargando(false);
        }
      } catch (e) {
        showToast('Error conectando con BoardGameGeek', 'error');
        mostrarCargando(false);
      }
    }

    async function cargarDetallesJuego(id) {
      try {
        const targetUrl = `https://boardgamegeek.com/xmlapi2/thing?id=${id}&stats=1`;
        const xmlText = await fetchProxy(targetUrl);

        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const item = xml.querySelector("item");

        currentGameId = id;
        document.getElementById('game-title').innerText = item.querySelector("name[type='primary']")?.getAttribute("value") || "Juego";
        document.getElementById('game-year').innerText = item.querySelector("yearpublished")?.getAttribute("value") || "N/A";
        
        const minP = item.querySelector("minplayers")?.getAttribute("value") || "?";
        const maxP = item.querySelector("maxplayers")?.getAttribute("value") || "?";
        document.getElementById('game-players').innerText = `👥 ${minP}-${maxP} jugadores`;
        
        const time = item.querySelector("playingtime")?.getAttribute("value") || "?";
        document.getElementById('game-time').innerText = `⏱️ ${time} min`;
        
        let desc = item.querySelector("description")?.textContent || "";
        desc = desc.replace(/&#10;/g, ' ').replace(/&quot;/g, '"');
        document.getElementById('game-desc').innerText = desc;
        
        const img = item.querySelector("image")?.textContent || item.querySelector("thumbnail")?.textContent || "";
        document.getElementById('game-img').src = img;

        mostrarCargando(false);
        document.getElementById('game-card').classList.remove('hidden');
      } catch (e) {
        showToast('Error al cargar la información del juego', 'error');
        mostrarCargando(false);
      }
    }

    async function agregarAColeccion() {
      const user = localStorage.getItem('bgg_user');
      const pass = localStorage.getItem('bgg_pass');

      if (!user || !pass) {
        toggleLoginModal();
        return;
      }

      const btn = document.getElementById('btn-add-bgg');
      btn.disabled = true;
      btn.innerText = 'Añadiendo a BGG...';

      try {
        const targetUrl = `https://boardgamegeek.com/geekcollection.php`;
        const params = new URLSearchParams({
          action: 'additem',
          objecttype: 'thing',
          objectid: currentGameId,
          own: '1'
        });

        await fetchProxy(`${targetUrl}?${params.toString()}`);
        showToast('🎉 ¡Añadido con éxito a tu colección BGG!', 'success');
      } catch (e) {
        showToast('Petición enviada a BGG', 'info');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>➕</span> Añadir a mi Colección BGG';
      }
    }

    function mostrarCargando(flag, text = "Cargando...") {
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading').classList.toggle('hidden', !flag);
      if (flag) document.getElementById('game-card').classList.add('hidden');
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `p-4 rounded-xl text-center text-sm font-semibold border ${
        type === 'success' ? 'bg-emerald-900/90 border-emerald-500 text-emerald-200' :
        type === 'error' ? 'bg-rose-900/90 border-rose-500 text-rose-200' :
        'bg-slate-800 border-amber-500 text-amber-200'
      }`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 5000);
    }
  </script>
</body>
</html>
